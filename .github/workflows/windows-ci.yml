name: Windows build and tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore NoorScanner.sln
      - name: Test core library
        run: dotnet test NoorScanner.sln --configuration Release --no-restore
      - name: Build Windows app
        run: dotnet build src/NoorScanner.App/NoorScanner.App.csproj --configuration Release --no-restore
